<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elo &mdash; Encontra quem procura o que ofereces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script>
  // TEMPOR&Aacute;RIO &mdash; apanha qualquer erro e mostra-o na p&aacute;gina,
  // para diagnosticar sem precisar de ferramentas de programador.
  function showErrorBanner(text) {
    var box = document.createElement("div");
    box.setAttribute("data-error-banner", "true");
    box.style.cssText = "background:#E4572E;color:white;padding:1rem;font-family:monospace;white-space:pre-wrap;font-size:0.9rem;position:fixed;top:0;left:0;right:0;z-index:9999;";
    box.textContent = text;
    document.body.prepend(box);
  }
  window.onerror = function (message, source, lineno) {
    showErrorBanner("ERRO: " + message + " (linha " + lineno + ", ficheiro " + source + ")");
  };
  window.addEventListener("unhandledrejection", function (event) {
    var reason = event.reason;
    var text = (reason && reason.message) ? reason.message : JSON.stringify(reason);
    showErrorBanner("ERRO ASS&Iacute;NCRONO: " + text);
  });
  // Turnstile (CAPTCHA): avisa quando o script terminar de carregar,
  // para o app.js poder desenhar o widget assim que a chave estiver pronta.
  window.turnstileReady = false;
  window.onTurnstileLoad = function () {
    window.turnstileReady = true;
    if (typeof renderTurnstileWidget === "function") renderTurnstileWidget();
  };
</script>
</head>
<body>

<header>
  <span class="brand">Elo</span>
  <div class="header-right">
    <select id="lang-switch" aria-label="Language / Idioma">
      <option value="pt">PT</option>
      <option value="en">EN</option>
    </select>
    <nav id="nav-logged" class="hidden">
      <button id="tab-profile" data-i18n="nav_profile"></button>
      <button id="tab-matches" data-i18n="nav_matches"></button>
      <button id="tab-messages" data-i18n="nav_messages"></button>
      <button id="btn-signout" data-i18n="nav_signout"></button>
    </nav>
    <nav id="nav-logged-out"></nav>
  </div>
</header>

<main>

  <!-- VISTA: Autentica&ccedil;&atilde;o -->
  <section id="view-auth" class="view hidden">
    <h1 data-i18n="auth_title"></h1>
    <p class="subtitle" data-i18n="auth_subtitle"></p>

    <label for="auth-email" data-i18n="auth_email_label"></label>
    <input id="auth-email" type="email" data-i18n-placeholder="auth_email_placeholder" />

    <label for="auth-password" data-i18n="auth_password_label"></label>
    <input id="auth-password" type="password" data-i18n-placeholder="auth_password_placeholder" />

    <button id="btn-signin" class="primary" data-i18n="auth_signin"></button>
    <button id="btn-signup" class="secondary" data-i18n="auth_signup"></button>

    <div id="turnstile-widget" class="cf-turnstile" style="margin-top:1rem;"></div>

    <p id="auth-status" class="status"></p>
  </section>

  <!-- VISTA: Perfil -->
  <section id="view-profile" class="view hidden">
    <h1 data-i18n="profile_title"></h1>
    <p class="subtitle" data-i18n="profile_subtitle"></p>

    <label for="profile-name" data-i18n="profile_name_label"></label>
    <input id="profile-name" type="text" data-i18n-placeholder="profile_name_placeholder" />

    <label for="profile-bio" data-i18n="profile_bio_label"></label>
    <textarea id="profile-bio" data-i18n-placeholder="profile_bio_placeholder"></textarea>

    <label for="profile-offers" data-i18n="profile_offers_label"></label>
    <input id="profile-offers" type="text" data-i18n-placeholder="profile_offers_placeholder" />
    <p class="hint" data-i18n="profile_offers_hint"></p>

    <label for="profile-seeks" data-i18n="profile_seeks_label"></label>
    <input id="profile-seeks" type="text" data-i18n-placeholder="profile_seeks_placeholder" />
    <p class="hint" data-i18n="profile_seeks_hint"></p>

    <button id="btn-save-profile" class="primary" data-i18n="profile_save"></button>
    <p id="profile-status" class="status"></p>
  </section>

  <!-- VISTA: Correspond&ecirc;ncias -->
  <section id="view-matches" class="view hidden">
    <h1 data-i18n="matches_title"></h1>
    <p class="subtitle" data-i18n="matches_subtitle"></p>
    <div id="matches-list"></div>
    <p id="matches-status" class="status"></p>
  </section>

  <!-- VISTA: Caixa de entrada -->
  <section id="view-messages" class="view hidden">
    <h1 data-i18n="inbox_title"></h1>
    <p class="subtitle" data-i18n="inbox_subtitle"></p>
    <div id="inbox-list"></div>
    <p id="inbox-status" class="status"></p>
  </section>

  <!-- VISTA: Conversa -->
  <section id="view-chat" class="view hidden">
    <button id="btn-back-inbox" class="secondary" data-i18n="chat_back"></button>
    <h1 id="chat-partner-name"></h1>
    <div id="chat-messages"></div>
    <div class="chat-input-row">
      <input id="chat-input" type="text" data-i18n-placeholder="chat_placeholder" />
      <button id="btn-send-message" class="primary" data-i18n="chat_send"></button>
    </div>
  </section>

</main>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer onerror="showErrorBanner('FALHA AO CARREGAR: Cloudflare Turnstile nao foi encontrado ou esta bloqueado pela rede.')"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="showErrorBanner('FALHA AO CARREGAR: biblioteca do Supabase (supabase-js) n&atilde;o foi encontrada ou est&aacute; bloqueada pela rede.')"></script>
<script src="config.js" onerror="showErrorBanner('FALHA AO CARREGAR: config.js n&atilde;o foi encontrado no reposit&oacute;rio &mdash; verifica se o nome do ficheiro est&aacute; exatamente correto.')"></script>
<script src="i18n.js" onerror="showErrorBanner('FALHA AO CARREGAR: i18n.js n&atilde;o foi encontrado no reposit&oacute;rio.')"></script>
<script src="app.js" onerror="showErrorBanner('FALHA AO CARREGAR: app.js n&atilde;o foi encontrado no reposit&oacute;rio &mdash; verifica se o nome do ficheiro est&aacute; exatamente correto.')"></script>
<script>
  // Vigia: se ao fim de 4 segundos nenhuma vista estiver vis&iacute;vel
  // e nenhum erro tiver sido mostrado, avisa que algo ficou preso.
  setTimeout(function () {
    var algumaVisivel = Array.from(document.querySelectorAll(".view")).some(
      function (v) { return !v.classList.contains("hidden"); }
    );
    var jaHaErro = document.querySelector('[data-error-banner]');
    if (!algumaVisivel && !jaHaErro) {
      showErrorBanner("AVISO: nenhum erro foi detetado, mas nada foi mostrado no ecr&atilde;. O c&oacute;digo pode ter ficado bloqueado antes de chegar ao fim.");
    }
  }, 4000);
</script>
</body>
</html>
